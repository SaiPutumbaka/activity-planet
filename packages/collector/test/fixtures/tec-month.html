<!doctype html>
<html lang="en-US">
  <head>
    <title>Events for November 2026 &#8211; Example Arts</title>
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link
      rel="alternate"
      type="text/calendar"
      title="Example Arts &raquo; iCal Feed"
      href="https://arts.example.org/events/?ical=1"
    />
  </head>
  <body class="post-type-archive post-type-archive-tribe_events tribe-events-page-template">
    <div class="tribe-common tribe-events tribe-events-view tribe-events-view--month">
      <ul class="tribe-events-c-view-selector__list">
        <li>
          <a
            href="https://arts.example.org/events/list/"
            class="tribe-events-c-view-selector__list-item-link"
            >List</a
          >
        </li>
        <li>
          <a
            href="https://arts.example.org/events/month/"
            class="tribe-events-c-view-selector__list-item-link"
            >Month</a
          >
        </li>
      </ul>
      <div class="tribe-events-calendar-month__calendar-event-details">
        <h3 class="tribe-events-calendar-month__calendar-event-title">
          <a
            href="https://arts.example.org/event/pottery-night/"
            title="Pottery Night"
            class="tribe-events-calendar-month__calendar-event-title-link tribe-common-anchor-thin"
            >Pottery Night</a
          >
        </h3>
      </div>
      <div class="tribe-events-calendar-month__calendar-event-details">
        <h3 class="tribe-events-calendar-month__calendar-event-title">
          <a
            href="https://arts.example.org/event/community-choir/"
            title="Community Choir"
            class="tribe-events-calendar-month__calendar-event-title-link tribe-common-anchor-thin"
            >Community Choir</a
          >
        </h3>
      </div>
      <div class="tribe-events-c-subscribe-dropdown">
        <a
          href="https://calendar.google.com/calendar/render?cid=webcal%3A%2F%2Farts.example.org%2Fevents%2F%3Fical%3D1"
          class="tribe-events-c-subscribe-dropdown__list-item-link"
          >Google Calendar</a
        >
        <a
          href="webcal://arts.example.org/events/?ical=1"
          class="tribe-events-c-subscribe-dropdown__list-item-link"
          >iCalendar</a
        >
        <a
          href="https://arts.example.org/events/?ical=1"
          class="tribe-events-c-subscribe-dropdown__export-link"
          >Export .ics file</a
        >
      </div>
    </div>
  </body>
</html>
