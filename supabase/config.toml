# Supabase CLI project configuration (minimal). The project is linked per environment in CI
# (see .github/workflows/migrate.yml); local `supabase start` is optional and not required for
# day-to-day work because migrations are applied to the hosted staging project first.
project_id = "activity-planet"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed/hubs.sql", "./seed/place_rules.sql"]

[auth]
enabled = true
site_url = "http://localhost:3001"
additional_redirect_urls = ["http://localhost:3000", "http://localhost:3001"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "5MiB"

# Edge Functions. Deployed to staging with the Supabase MCP / CLI; secrets (service role) come
# from the project's own environment, never from this file.
[functions.delete-account]
# Advisory only: on staging a request carrying just the publishable key still reached the
# function, so the function verifies the user JWT itself against the project's JWKS (role must
# be authenticated) and refuses unless request_account_deletion() ran.
verify_jwt = true

[functions.send-verification-code]
# Same pattern as delete-account: the gateway check is advisory, so the function verifies the
# user JWT itself (role must be authenticated) before calling create_verification_code with
# the service role. RESEND_API_KEY is an optional project secret; without it the code is not
# emailed (staging) and the response still says sent.
verify_jwt = true

[functions.import-feed]
# The caller is the database (pg_cron through pg_net, public.import_dispatch), not a user, so
# the gateway JWT check is off; the function refuses any request whose x-import-secret header
# does not match the vault secret import_feed_secret (checked through import_verify_secret,
# service_role only). The secret is generated inside the database and is in no file.
verify_jwt = false

[functions.collector]
# The callers are the hub map collector jobs (GitHub Actions, D-040, D-041), not users, so the
# gateway JWT check is off; the function refuses any request whose x-collector-secret header does
# not match the vault secret collector_secret (checked through collector_verify_secret,
# service_role only). The secret is generated inside the database and is in no file.
verify_jwt = false

[functions.places-fill]
# The caller is the database (pg_cron job places-fill and a ping when a place tile becomes
# fillable, both through pg_net and public.places_fill_dispatch, migration 43), not a user, so
# the gateway JWT check is off; the function refuses any request whose x-collector-secret header
# does not match the vault secret collector_secret (collector_verify_secret, service_role only).
# GEOAPIFY_SERVER_KEY is an optional Edge Function secret; without it the function does nothing.
verify_jwt = false

[functions.place-files]
# Two callers (D-042 slice 11, migration 49): the database (pg_cron job place-match through pg_net
# and public.place_match_dispatch, with the x-collector-secret header checked through
# collector_verify_secret) and signed-in members asking for a file place's row (the function checks
# the user token with the Auth API itself). So the gateway JWT check is off. Files are read from
# PLACES_BASE_URL (optional Edge Function secret) or meta.places_base_url.
verify_jwt = false

[functions.image-guard]
# The caller is the database (migration 52: the image reference triggers, mod_takedown_block_image
# and the pg_cron job image-guard-tick, all through pg_net and public.image_guard_dispatch), not a
# user, so the gateway JWT check is off; the function refuses any request whose
# x-image-guard-secret header does not match the vault secret image_guard_secret (checked through
# image_guard_verify_secret, service_role only). The secret is generated inside the database and
# is in no file. The function stores hashes only, never an image.
verify_jwt = false

[functions.send-notifications]
# The caller is the database (migration 55: the pg_cron job send-notifications every 2 minutes,
# through pg_net and public.notify_worker_dispatch), not a user, so the gateway JWT check is off;
# the function refuses any request whose x-notify-secret header does not match the vault secret
# notify_worker_secret (checked through notify_worker_verify_secret, service_role only). The
# secret is generated inside the database and is in no file. RESEND_API_KEY and the VAPID keys
# are optional Edge Function secrets; without them email and push are marked skipped.
verify_jwt = false

[functions.stripe-connect]
# Coaching (migration 60, D-044): Stripe Connect Express onboarding, the dashboard link and an
# account refresh for a signed-in coach. The function also verifies the user JWT itself against
# the project's JWKS (role must be authenticated). STRIPE_SECRET_KEY is an optional Edge Function
# secret; without it every request answers 503 {"error":"payments_off"}.
verify_jwt = true

[functions.stripe-checkout]
# Two callers (migration 60): signed-in clients ({op: "create"}, the function verifies the user
# JWT itself against the project's JWKS) and the database ({op: "job"} through pg_net and
# public.stripe_dispatch, with the x-stripe-dispatch-secret header checked through
# stripe_dispatch_verify_secret, service_role only; the secret is generated inside the database).
# So the gateway JWT check is off. Without STRIPE_SECRET_KEY every request answers 503
# {"error":"payments_off"}.
verify_jwt = false

[functions.stripe-webhook]
# The caller is Stripe, which signs every request (Stripe-Signature, verified with
# STRIPE_WEBHOOK_SECRET and the optional STRIPE_CONNECT_WEBHOOK_SECRET), so the gateway JWT check
# is off. Without STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET every request answers 503
# {"error":"payments_off"}.
verify_jwt = false

[functions.organizer-verify]
# Collector completion (migration 62, design 2.3): a signed-in organizer asks for the DNS TXT check
# of their claim. The function also verifies the user JWT itself against the project's JWKS (role
# must be authenticated) and reads the claim with that JWT. It contacts only the public
# DNS-over-HTTPS resolver, never the claimed host. No secret of its own.
verify_jwt = true

[functions.eventbrite-connect]
# Collector completion (migration 62, design 2.8): Eventbrite organizer OAuth. Two callers:
# signed-in organizers (start, callback; the function verifies the user JWT itself against the
# project's JWKS) and the collector job ({op: "sync"} with the x-collector-secret header, checked
# through collector_verify_secret). So the gateway JWT check is off. Without EVENTBRITE_CLIENT_ID,
# EVENTBRITE_CLIENT_SECRET and EVENTBRITE_REDIRECT_URI every request answers 200
# {"skipped":"no key"}.
verify_jwt = false

[functions.recs-embed]
# Recommendations (migration 67, D-045): the caller is the database (pg_cron job recs-embed every
# minute, through pg_net and public.recs_embed_dispatch), not a user, so the gateway JWT check is
# off; the function refuses any request whose x-recs-secret header does not match the vault secret
# recs_embed_secret (checked through recs_embed_verify_secret, service_role only). The model is
# Supabase's built-in gte-small (no key, no vendor). Logs counts only.
verify_jwt = false

[functions.weekly-scorecard]
# The Monday counts-only scorecard email (migration 67): the caller is the database (pg_cron job
# weekly-scorecard through pg_net and public.scorecard_dispatch) with the x-scorecard-secret
# header (vault secret scorecard_secret, checked through scorecard_verify_secret). RESEND_API_KEY
# and SCORECARD_TO are optional Edge Function secrets; without either the run is recorded as
# skipped_no_key and nothing is sent.
verify_jwt = false
