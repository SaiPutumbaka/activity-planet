name: CI

on:
  push:
    branches: [main]
  pull_request:

# Launch audit L6: read-only token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-time placeholders so Next/Vite can bundle; real values live in Vercel.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.15.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # Deno unit tests for the import-feed adapters (fixture payloads; no network) and the collector
  # request parsing, the Geoapify places fill and the place-file matching (fake I/O), and the
  # image-guard perceptual hashes (synthetic fixture images) and check/sweep runs (fake I/O), and the
  # Stripe functions for coaching (mocked Stripe).
  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.1.4
      - run: deno test --allow-read supabase/functions/import-feed supabase/functions/collector supabase/functions/places-fill supabase/functions/place-files supabase/functions/send-notifications supabase/functions/organizer-verify supabase/functions/eventbrite-connect
      - run: deno check supabase/functions/send-notifications/index.ts
      # Recommendations (migration 67): the recs-embed batch with a fake model, and the weekly
      # scorecard with fake RPCs and sender (no network, no key, no model download).
      - run: deno test --allow-read supabase/functions/recs-embed supabase/functions/weekly-scorecard
      - run: deno check supabase/functions/recs-embed/index.ts supabase/functions/weekly-scorecard/index.ts
      # Coaching payments (migration 60): Stripe Connect, Checkout and the webhook, with a mocked
      # Stripe (no network, no key). The index files import supabase-js from npm.
      - run: deno test --allow-read supabase/functions/stripe-connect supabase/functions/stripe-checkout supabase/functions/stripe-webhook
      # Launch audit: delete-account (the evidence hold and the sweep's cleanup, fake Supabase) and
      # the verification email copy.
      - run: deno test --allow-read --node-modules-dir=none supabase/functions/delete-account supabase/functions/send-verification-code
      - run: deno check --node-modules-dir=none supabase/functions/send-verification-code/index.ts
      - run: deno check --node-modules-dir=none supabase/functions/stripe-connect/index.ts supabase/functions/stripe-checkout/index.ts supabase/functions/stripe-webhook/index.ts supabase/functions/delete-account/index.ts supabase/functions/organizer-verify/index.ts supabase/functions/eventbrite-connect/index.ts
      # image-guard decodes JPEG and PNG with npm packages (jpeg-js, fast-png); without a
      # node_modules folder Deno must fetch them itself, hence --node-modules-dir=none.
      - run: deno test --allow-read --node-modules-dir=none supabase/functions/image-guard
      - run: deno check --node-modules-dir=none supabase/functions/image-guard/index.ts

  # Hub map place rules (D-041): rebuild the JSON from the research tables, regenerate the seed and
  # the osmium filter, and fail if anything differs from what is committed (stdlib only); then the
  # extract evaluator's tests.
  place-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rebuild hub_place_rules.json from scripts/places/rules
        run: python3 -I scripts/places/build_rules_json.py
      - name: Regenerate supabase/seed/place_rules.sql and scripts/places/filters.txt
        run: python3 -I scripts/places/gen_place_rules.py --check
      - name: Fail if a generated file differs from the commit
        run: |
          git status --porcelain -- scripts/places supabase/seed
          git diff --exit-code -- scripts/places supabase/seed
          test -z "$(git status --porcelain -- scripts/places supabase/seed)"
      # The extract job's evaluator (slice 5); shapely from Ubuntu, as places-extract.yml uses.
      - name: Extract evaluator tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-shapely > /dev/null
          python3 -I -m unittest discover -s scripts/places -p 'test_*.py' -v
