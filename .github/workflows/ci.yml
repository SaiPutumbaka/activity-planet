name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-time placeholders so Next/Vite can bundle; real values live in Vercel.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # Deno unit tests for the import-feed adapters (fixture payloads; no network) and the collector
  # request parsing, the Geoapify places fill and the place-file matching (fake I/O), and the
  # image-guard perceptual hashes (synthetic fixture images) and check/sweep runs (fake I/O).
  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      - run: deno test --allow-read supabase/functions/import-feed supabase/functions/collector supabase/functions/places-fill supabase/functions/place-files supabase/functions/send-notifications
      - run: deno check supabase/functions/send-notifications/index.ts
      # image-guard decodes JPEG and PNG with npm packages (jpeg-js, fast-png); without a
      # node_modules folder Deno must fetch them itself, hence --node-modules-dir=none.
      - run: deno test --allow-read --node-modules-dir=none supabase/functions/image-guard
      - run: deno check --node-modules-dir=none supabase/functions/image-guard/index.ts

  # Hub map place rules (D-041): rebuild the JSON from the research tables, regenerate the seed and
  # the osmium filter, and fail if anything differs from what is committed (stdlib only); then the
  # extract evaluator's tests.
  place-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild hub_place_rules.json from scripts/places/rules
        run: python3 -I scripts/places/build_rules_json.py
      - name: Regenerate supabase/seed/place_rules.sql and scripts/places/filters.txt
        run: python3 -I scripts/places/gen_place_rules.py --check
      - name: Fail if a generated file differs from the commit
        run: |
          git status --porcelain -- scripts/places supabase/seed
          git diff --exit-code -- scripts/places supabase/seed
          test -z "$(git status --porcelain -- scripts/places supabase/seed)"
      # The extract job's evaluator (slice 5); shapely from Ubuntu, as places-extract.yml uses.
      - name: Extract evaluator tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-shapely > /dev/null
          python3 -I -m unittest discover -s scripts/places -p 'test_*.py' -v
