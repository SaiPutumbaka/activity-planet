name: Places extract

# OpenStreetMap places for the hub map (D-041 slice 5, docs/design/hub-map/HUB_MAP_DESIGN.md 3.1).
# For each requested place tile: pick the smallest Geofabrik extracts that cover it, cache them for
# the ISO week, keep the rule base tags with osmium (scripts/places/filters.txt), cut the tiles'
# box plus 2 km, export points, lines and polygons, then scripts/places/extract_places.py reduces
# them to points, evaluates the place rules, and posts batches to the collector Edge Function
# (POST /collector/ingest/places, then /collector/tiles/{id}/done).
#
# Where it posts:
#   * workflow_dispatch from a ref other than main: STAGING only.
#   * workflow_dispatch from main: PRODUCTION only when the input production is "production";
#     otherwise it evaluates and measures and posts nothing.
#   * push to a branch other than main that changes scripts/places/extract_request.json: STAGING,
#     with that file's region/post/force (dispatch works only once this file is on main).
#   * schedule (nightly, D-042 slice 2): a no-op unless the repository variable
#     PLACES_EXTRACT_SCHEDULE is "production" and production's tiles queue is not empty. Every
#     night builds wanted (and filling) tiles worldwide; active tiles due a refresh (no OSM run for
#     6 days) are added on Sundays (UTC) only. A dispatch takes refreshes when refresh is ticked.
#
# Per-run budget (D-042 slice 2, design 5.1 and 7; dispatch inputs, the schedule uses the
# defaults): at most 12 tiles, 6 Geofabrik files and 6 GB of downloads (every extract counts,
# cached or not), no extract over 3 GB (HEAD Content-Length; unknown sizes wait), and never more
# download bytes than the runner's free disk allows (less 3 GB, over 1.25). Tiles go in queue
# order (no OSM run first, then demand), so one download serves every queued tile inside it. A
# tile left out gets a reason on the server (place_tiles_set_queue_reasons: budget, size_cap,
# extract_too_big; migration 41) and the map says why it is still being mapped; a built or
# planned tile clears it. want_tiles (staging only) adds tile ids as wanted before the queue is read.
#
# Guards: a tile with more than 60,000 rows fails before posting; the run refuses to post when the
# places table plus the estimated new rows (1,600 bytes each, measured in design 4.5) would pass
# the 150 MB places cap, or the whole database plus them would pass 450 MB (the 500 MB plan less
# headroom); a tile whose row count fell more than 30% against its last finished run's seen count
# (read from the server for every tile) is not posted, and finish_place_tile refuses the same drop
# (row_count_drop) before anything is missed or closed. allow_drop accepts a drop on purpose.
#
# Secrets: none of its own. It links the target project with SUPABASE_ACCESS_TOKEN and the
# database password (as migrate.yml does), reads the collector secret that migration 28 generated
# in that project's vault, masks it, and uses it only as the x-collector-secret header. The
# service-role key never reaches the job. Logs hold counts, sizes, error names and a few sample
# rows of public OpenStreetMap data; never the secret and never member data.

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Region from scripts/places/regions.json (atlanta), tile ids (178030,178031), or queue"
        type: string
        default: "atlanta"
      post:
        description: "Post to the collector (off: evaluate and measure only)"
        type: boolean
        default: true
      force:
        description: "Run named tiles even when they are not wanted or due a refresh"
        type: boolean
        default: false
      allow_drop:
        description: "Finish tiles whose row count fell more than 30% (a drop you expect, such as a removed rule)"
        type: boolean
        default: false
      production:
        description: "Type production to post to PRODUCTION (only from main)"
        type: string
        default: ""
      refresh:
        description: "Also take active tiles due a weekly refresh (the schedule does on Sundays)"
        type: boolean
        default: false
      want_tiles:
        description: "STAGING only: tile ids to add as wanted before the queue is read (e.g. 198375)"
        type: string
        default: ""
      max_tiles:
        description: "Most tiles this run builds"
        type: string
        default: "12"
      max_downloads:
        description: "Most Geofabrik files this run uses"
        type: string
        default: "6"
      max_download_gb:
        description: "Most Geofabrik bytes this run uses, in GB"
        type: string
        default: "6"
      max_extract_gb:
        description: "Largest single Geofabrik extract, in GB"
        type: string
        default: "3"
  push:
    branches-ignore: [main]
    paths:
      - "scripts/places/extract_request.json"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: places-extract
  cancel-in-progress: false

env:
  STAGING_PROJECT_REF: gzrscndzzggxmcwnvvcq
  PROD_PROJECT_REF: gtesfiqxqontescqpllo
  PLACES_CAP_BYTES: "157286400"
  DB_CAP_BYTES: "471859200"
  USER_AGENT: "ActivityPlanet-places/1 (+https://github.com/SaiPutumbaka/activity-planet)"

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Decide target and region
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          IN_REGION: ${{ inputs.region }}
          IN_POST: ${{ inputs.post }}
          IN_FORCE: ${{ inputs.force }}
          IN_ALLOW_DROP: ${{ inputs.allow_drop }}
          IN_PRODUCTION: ${{ inputs.production }}
          IN_REFRESH: ${{ inputs.refresh }}
          IN_WANT: ${{ inputs.want_tiles }}
          IN_MAX_TILES: ${{ inputs.max_tiles }}
          IN_MAX_DOWNLOADS: ${{ inputs.max_downloads }}
          IN_MAX_DOWNLOAD_GB: ${{ inputs.max_download_gb }}
          IN_MAX_EXTRACT_GB: ${{ inputs.max_extract_gb }}
          SCHEDULE_VAR: ${{ vars.PLACES_EXTRACT_SCHEDULE }}
        run: |
          target=none; region=""; post=false; force=false; allow_drop=false; refresh=false; want=""
          max_tiles=12; max_downloads=6; max_download_gb=6; max_extract_gb=3
          case "$EVENT" in
            schedule)
              # Refreshes on Sundays (UTC) only; wanted tiles every night.
              [ "$(date -u +%u)" = "7" ] && refresh=true
              if [ "$SCHEDULE_VAR" = "production" ] && [ "$REF" = "refs/heads/main" ]; then
                target=production; region=queue; post=true
              else
                echo "Scheduled run: PLACES_EXTRACT_SCHEDULE is not production; nothing to do."
              fi ;;
            workflow_dispatch)
              region="$IN_REGION"; force="$IN_FORCE"; post="$IN_POST"; allow_drop="$IN_ALLOW_DROP"
              refresh="$IN_REFRESH"; want="$IN_WANT"
              max_tiles="${IN_MAX_TILES:-12}"; max_downloads="${IN_MAX_DOWNLOADS:-6}"
              max_download_gb="${IN_MAX_DOWNLOAD_GB:-6}"; max_extract_gb="${IN_MAX_EXTRACT_GB:-3}"
              if [ "$REF" = "refs/heads/main" ]; then
                if [ "$IN_PRODUCTION" = "production" ]; then target=production; else target=none; post=false; fi
              else
                if [ -n "$IN_PRODUCTION" ]; then echo "production is only reachable from main"; exit 1; fi
                target=staging
              fi ;;
            push)
              if [ "$REF" = "refs/heads/main" ]; then echo "never on main pushes"; exit 1; fi
              target=staging
              region=$(python3 -I -c 'import json;print(json.load(open("scripts/places/extract_request.json"))["region"])')
              post=$(python3 -I -c 'import json;print(str(json.load(open("scripts/places/extract_request.json")).get("post", False)).lower())')
              force=$(python3 -I -c 'import json;print(str(json.load(open("scripts/places/extract_request.json")).get("force", False)).lower())')
              allow_drop=$(python3 -I -c 'import json;print(str(json.load(open("scripts/places/extract_request.json")).get("allow_drop", False)).lower())')
              refresh=$(python3 -I -c 'import json;print(str(json.load(open("scripts/places/extract_request.json")).get("refresh", False)).lower())')
              want=$(python3 -I -c 'import json;print(json.load(open("scripts/places/extract_request.json")).get("want_tiles", ""))')
              max_tiles=$(python3 -I -c 'import json;print(json.load(open("scripts/places/extract_request.json")).get("max_tiles", 12))') ;;
          esac
          case "$want" in *[!0-9,]*) echo "Refusing want_tiles: $want"; exit 1 ;; esac
          if [ -n "$want" ] && [ "$target" != "staging" ]; then echo "want_tiles is staging only"; exit 1; fi
          for v in "$max_tiles" "$max_downloads"; do
            case "$v" in ''|*[!0-9]*) echo "Refusing budget input: $v"; exit 1 ;; esac
          done
          for v in "$max_download_gb" "$max_extract_gb"; do
            case "$v" in ''|*[!0-9.]*) echo "Refusing budget input: $v"; exit 1 ;; esac
          done
          [ "$refresh" = "true" ] || refresh=false
          case "$region" in *[!a-zA-Z0-9,_-]*) echo "Refusing region: $region"; exit 1 ;; esac
          if [ "$target" = "none" ] && [ "$EVENT" = "schedule" ]; then region=""; fi
          if [ "$target" = "none" ]; then post=false; fi
          if [ "$post" != "true" ] && [ "$region" = "queue" ]; then echo "region queue needs post"; exit 1; fi
          ref=""
          [ "$target" = "staging" ] && ref="$STAGING_PROJECT_REF"
          [ "$target" = "production" ] && ref="$PROD_PROJECT_REF"
          [ "$allow_drop" = "true" ] || allow_drop=false
          kinds=wanted; [ "$refresh" = "true" ] && kinds=wanted,refresh
          echo "target=$target region=$region post=$post force=$force allow_drop=$allow_drop kinds=$kinds want=${want:-none}"
          echo "budget: $max_tiles tiles, $max_downloads files, $max_download_gb GB, largest extract $max_extract_gb GB"
          {
            echo "target=$target"; echo "project_ref=$ref"; echo "region=$region"
            echo "post=$post"; echo "force=$force"; echo "allow_drop=$allow_drop"
            echo "kinds=$kinds"; echo "want=$want"
            echo "max_tiles=$max_tiles"; echo "max_downloads=$max_downloads"
            echo "max_download_gb=$max_download_gb"; echo "max_extract_gb=$max_extract_gb"
            echo "week=$(date -u +%G-W%V)"
            echo "run_id=gh-${{ github.run_id }}-${{ github.run_attempt }}"
          } >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v1
        if: steps.mode.outputs.post == 'true'
        with:
          version: 2.122.0

      # The secret is captured, never echoed; ::add-mask:: hides it if anything ever prints it.
      - name: Link the target and read the collector secret
        if: steps.mode.outputs.post == 'true'
        id: link
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ steps.mode.outputs.target == 'production' && secrets.SUPABASE_PROD_DB_PASSWORD || secrets.SUPABASE_STAGING_DB_PASSWORD }}
          PROJECT_REF: ${{ steps.mode.outputs.project_ref }}
        run: |
          supabase link --project-ref "$PROJECT_REF" > /dev/null
          out=$(supabase db query --linked "select 'CSECRET:' || ds.decrypted_secret as v from vault.decrypted_secrets ds where ds.name = 'collector_secret'" 2>/dev/null || true)
          secret=$(printf '%s' "$out" | grep -o 'CSECRET:[0-9a-f]\{64\}' | head -1 | cut -d: -f2)
          unset out
          if [ -z "$secret" ]; then echo "collector_secret not found in the target vault"; exit 1; fi
          echo "::add-mask::$secret"
          echo "COLLECTOR_SECRET=$secret" >> "$GITHUB_ENV"
          echo "Collector secret read (masked)."

      - name: Database size before
        if: steps.mode.outputs.post == 'true'
        id: before
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          out=$(supabase db query --linked "select 'DBBYTES:' || pg_database_size(current_database()) || ':' || pg_total_relation_size('public.places') as v")
          db=$(printf '%s' "$out" | grep -o 'DBBYTES:[0-9]*:[0-9]*' | head -1)
          [ -n "$db" ] || { echo "could not read the database size"; exit 1; }
          echo "db_bytes=$(echo "$db" | cut -d: -f2)" >> "$GITHUB_OUTPUT"
          echo "places_bytes=$(echo "$db" | cut -d: -f3)" >> "$GITHUB_OUTPUT"
          echo "database $(echo "$db" | cut -d: -f2) bytes, places $(echo "$db" | cut -d: -f3) bytes"
          # Slice 15's size alarm (120 MB, design 4.5 and 9): time to start the static-file fallback.
          if [ "$(echo "$db" | cut -d: -f3)" -ge 125829120 ]; then
            echo "::warning title=Places size alarm::the places table is $(echo "$db" | cut -d: -f3) bytes, past the 120 MB alarm (cap 150 MB)"
          fi

      # Staging only (checked in "Decide target"): test tiles join the queue as wanted.
      - name: Add wanted tiles (staging)
        if: steps.mode.outputs.post == 'true' && steps.mode.outputs.want != '' && steps.mode.outputs.target == 'staging'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          WANT: ${{ steps.mode.outputs.want }}
        run: |
          case "$WANT" in *[!0-9,]*) echo "bad want_tiles"; exit 1 ;; esac
          supabase db query --linked "with i as (insert into public.place_tiles (id, status) select t, 'wanted'::public.place_tile_status from unnest(array[$WANT]::integer[]) t where t between 0 and 259199 on conflict (id) do nothing returning id) select count(*) as added from i"

      - name: Tiles queue
        if: steps.mode.outputs.post == 'true'
        env:
          PROJECT_REF: ${{ steps.mode.outputs.project_ref }}
          KINDS: ${{ steps.mode.outputs.kinds }}
        run: |
          mkdir -p work
          code=$(curl -sS -o work/queue.json -w '%{http_code}' -H "x-collector-secret: $COLLECTOR_SECRET" \
            "https://$PROJECT_REF.supabase.co/functions/v1/collector/tiles?status=$KINDS&limit=100")
          [ "$code" = "200" ] || { echo "tiles queue: HTTP $code"; exit 1; }
          python3 -I -c 'import json;q=json.load(open("work/queue.json"))["tiles"];print(f"{len(q)} tiles queued:", [(t["id"], t["status"], t["row_count"], t.get("queue_reason")) for t in q])'

      - name: Resolve tiles
        id: tiles
        if: steps.mode.outputs.region != ''
        env:
          REGION: ${{ steps.mode.outputs.region }}
          FORCE: ${{ steps.mode.outputs.force }}
        run: |
          mkdir -p work
          args="--region $REGION"
          [ -f work/queue.json ] && args="$args --queue work/queue.json"
          [ "$FORCE" = "true" ] && args="$args --force"
          tiles=$(python3 -I scripts/places/extract_places.py tiles $args)
          echo "candidate tiles: ${tiles:-none}"
          echo "tiles=$tiles" >> "$GITHUB_OUTPUT"

      - name: Cache the Geofabrik index
        if: steps.tiles.outputs.tiles != ''
        uses: actions/cache@v4
        with:
          path: geofabrik/index-v1.json
          key: geofabrik-index-${{ steps.mode.outputs.week }}

      - name: Plan extracts
        id: plan
        if: steps.tiles.outputs.tiles != ''
        env:
          TILES: ${{ steps.tiles.outputs.tiles }}
        run: |
          mkdir -p geofabrik
          if [ ! -s geofabrik/index-v1.json ]; then
            curl -fsSL --retry 4 --retry-delay 30 --retry-all-errors -A "$USER_AGENT" -o geofabrik/index-v1.json https://download.geofabrik.de/index-v1.json
          fi
          python3 -I scripts/places/extract_places.py plan --index geofabrik/index-v1.json --tiles "$TILES" --lenient --out work/plan_all.json

      # The per-run budget: HEAD sizes (Geofabrik's index has none), free disk, then the tiles this
      # run builds in queue order; the others wait with a reason (recorded at the end).
      - name: Budget
        id: budget
        if: steps.tiles.outputs.tiles != ''
        env:
          TILES: ${{ steps.tiles.outputs.tiles }}
          MAX_TILES: ${{ steps.mode.outputs.max_tiles }}
          MAX_DOWNLOADS: ${{ steps.mode.outputs.max_downloads }}
          MAX_DOWNLOAD_GB: ${{ steps.mode.outputs.max_download_gb }}
          MAX_EXTRACT_GB: ${{ steps.mode.outputs.max_extract_gb }}
        run: |
          python3 -I -c 'import json
          for i, e in sorted(json.load(open("work/plan_all.json"))["extracts"].items()):
              print(i, e["pbf"])' > work/all_extracts.txt
          : > work/sizes.txt
          while read -r id url; do
            len=$(curl -fsSIL --retry 3 --retry-delay 10 -A "$USER_AGENT" "$url" | tr -d '\r' | awk 'tolower($1)=="content-length:"{v=$2} END{print v}' || true)
            echo "$id ${len:-none}" >> work/sizes.txt
          done < work/all_extracts.txt
          python3 -I -c 'import json
          d = {}
          for line in open("work/sizes.txt"):
              i, v = line.split()
              d[i] = int(v) if v.isdigit() else None
          json.dump(d, open("work/sizes.json", "w"))'
          mkdir -p geofabrik
          free=$(df --output=avail -B1 geofabrik | tail -1 | tr -d ' ')
          python3 -I scripts/places/extract_places.py budget --plan work/plan_all.json --sizes work/sizes.json \
            --order "$TILES" --max-tiles "$MAX_TILES" --max-downloads "$MAX_DOWNLOADS" \
            --max-download-gb "$MAX_DOWNLOAD_GB" --max-extract-gb "$MAX_EXTRACT_GB" --disk-free "$free" \
            --out work/plan.json --deferred work/deferred.json --tiles-out work/tiles.txt
          tiles=$(cat work/tiles.txt)
          echo "tiles this run: ${tiles:-none}"
          echo "tiles=$tiles" >> "$GITHUB_OUTPUT"
          key=$(python3 -I -c 'import json;print("-".join(sorted(json.load(open("work/plan.json"))["extracts"])).replace("/", "_"))')
          echo "key=$key" >> "$GITHUB_OUTPUT"

      # Every named tile's previous count, from the server: the seen count of its last finished OSM
      # run (what finish_place_tile's row_count_drop guard uses), or none. Tile ids and counts only.
      - name: Previous counts
        if: steps.budget.outputs.tiles != '' && steps.mode.outputs.post == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TILES: ${{ steps.budget.outputs.tiles }}
        run: |
          case "$TILES" in *[!0-9,]*) echo "bad tiles"; exit 1 ;; esac
          out=$(supabase db query --linked "select 'PREV:' || string_agg(t.id || '=' || coalesce((select r.stats ->> 'seen' from public.place_tile_runs r where r.tile_id = t.id and r.source = 'osm' and r.finished_at is not null order by r.finished_at desc, r.started_at desc limit 1), 'none'), ',' order by t.id) as v from unnest(array[$TILES]::integer[]) as t(id)")
          prev=$(printf '%s' "$out" | grep -o 'PREV:[0-9a-z=,]*' | head -1 | cut -d: -f2)
          [ -n "$prev" ] || { echo "could not read the previous counts"; exit 1; }
          PREV="$prev" python3 -I -c 'import json, os
          d = {k: (None if v == "none" else int(v)) for k, v in (x.split("=") for x in os.environ["PREV"].split(","))}
          json.dump(d, open("work/previous.json", "w"))
          print("previous seen counts:", d)'

      - name: Install osmium and shapely
        if: steps.budget.outputs.tiles != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool python3-shapely > /dev/null
          osmium --version | head -1
          python3 -I -c 'import shapely; print("shapely", shapely.__version__)'

      # Restore and save separately, so a download is kept for the week even if a later step fails.
      - name: Restore the extracts for the week
        id: pbfcache
        if: steps.budget.outputs.tiles != ''
        uses: actions/cache/restore@v4
        with:
          path: geofabrik/pbf
          key: geofabrik-${{ steps.budget.outputs.key }}-${{ steps.mode.outputs.week }}

      - name: Download missing extracts
        if: steps.budget.outputs.tiles != ''
        run: |
          mkdir -p geofabrik/pbf
          python3 -I -c 'import json
          for i, e in sorted(json.load(open("work/plan.json"))["extracts"].items()):
              print(i.replace("/", "_"), e["pbf"])' > work/extracts.txt
          while read -r id url; do
            f="geofabrik/pbf/$id.osm.pbf"
            if [ -s "$f" ]; then echo "$id: cached, $(stat -c %s "$f") bytes"; continue; fi
            # The md5 first: if "latest" moves on during the download, the retry gets a matching pair.
            ok=""
            for attempt in 1 2 3; do
              curl -fsSL --retry 4 --retry-delay 30 --retry-all-errors -A "$USER_AGENT" -o "$f.md5" "$url.md5" || true
              curl -fsSL --retry 4 --retry-delay 30 --retry-all-errors -A "$USER_AGENT" -o "$f" "$url" || true
              [ -f "$f" ] || touch "$f"; [ -f "$f.md5" ] || touch "$f.md5"
              want=$(grep -o '^[0-9a-f]\{32\}' "$f.md5" | head -1); got=$(md5sum "$f" | cut -d' ' -f1)
              if [ -n "$want" ] && [ "$want" = "$got" ]; then ok=1; break; fi
              echo "$id: md5 mismatch on attempt $attempt (want ${want:-none}, got $got, $(stat -c %s "$f") bytes, md5 file $(stat -c %s "$f.md5") bytes)"
              sleep 20
            done
            [ -n "$ok" ] || { rm -f "$f"; exit 1; }
            echo "$id: downloaded, $(stat -c %s "$f") bytes"
          done < work/extracts.txt

      - name: Save the extracts for the week
        if: steps.budget.outputs.tiles != '' && steps.pbfcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: geofabrik/pbf
          key: geofabrik-${{ steps.budget.outputs.key }}-${{ steps.mode.outputs.week }}

      - name: Filter, cut and export with osmium
        if: steps.budget.outputs.tiles != ''
        run: |
          python3 -I -c 'import json
          for g in json.load(open("work/plan.json"))["groups"]:
              print(g["name"].replace("/", "_"), ",".join(str(v) for v in g["bbox"]), " ".join(x.replace("/", "_") for x in g["extracts"]))' > work/groups.txt
          while read -r name bbox extracts; do
            fs=""; rs=""
            for id in $extracts; do
              osmium tags-filter "geofabrik/pbf/$id.osm.pbf" --expressions=scripts/places/filters.txt -o "work/f_$id.pbf" --overwrite
              osmium tags-filter "geofabrik/pbf/$id.osm.pbf" wr/landuse=residential -o "work/r_$id.pbf" --overwrite
              fs="$fs work/f_$id.pbf"; rs="$rs work/r_$id.pbf"
            done
            if [ "$(echo $fs | wc -w)" -gt 1 ]; then
              osmium merge $fs -o "work/f_$name.all.pbf" --overwrite; osmium merge $rs -o "work/r_$name.all.pbf" --overwrite
            else
              cp $fs "work/f_$name.all.pbf"; cp $rs "work/r_$name.all.pbf"
            fi
            osmium extract -b "$bbox" -s smart "work/f_$name.all.pbf" -o "work/t_$name.pbf" --overwrite
            osmium extract -b "$bbox" -s smart "work/r_$name.all.pbf" -o "work/tr_$name.pbf" --overwrite
            osmium export "work/t_$name.pbf" -f geojsonseq --geometry-types=point,linestring,polygon --add-unique-id=type_id -o "work/features_$name.geojsonseq" --overwrite
            osmium export "work/tr_$name.pbf" -f geojsonseq --geometry-types=polygon -o "work/res_$name.geojsonseq" --overwrite
            echo "$name: filtered $(stat -c %s "work/f_$name.all.pbf") bytes, cut $(stat -c %s "work/t_$name.pbf") bytes, $(wc -l < "work/features_$name.geojsonseq") features, $(wc -l < "work/res_$name.geojsonseq") residential polygons"
          done < work/groups.txt

      - name: Evaluate rules
        if: steps.budget.outputs.tiles != ''
        run: |
          python3 -I -c 'import json
          for g in json.load(open("work/plan.json"))["groups"]:
              print(g["name"], g["name"].replace("/", "_"))' > work/groupnames.txt
          while read -r name safe; do
            python3 -I scripts/places/extract_places.py evaluate --plan work/plan.json --group "$name" \
              --features "work/features_$safe.geojsonseq" --residential "work/res_$safe.geojsonseq" --out-dir work/rows
          done < work/groupnames.txt

      # Two limits (design 4.5 and 10): places at most 150 MB, and the whole database at most 450 MB.
      # Rows a tile gains over its previous count are charged 1,600 bytes each (steady state after a
      # refresh); rows it already has are charged 600 bytes, the growth measured from the first
      # ingest (1.0 KB a row) to after a refresh (1.6 KB a row), since they are already counted.
      - name: Size check
        if: steps.budget.outputs.tiles != ''
        env:
          DB_BYTES: ${{ steps.before.outputs.db_bytes }}
          PLACES_BYTES: ${{ steps.before.outputs.places_bytes }}
        run: |
          python3 -I - <<'EOF'
          import glob, json, os
          prev = json.load(open("work/previous.json")) if os.path.exists("work/previous.json") else {}
          per_row, per_existing = 1600, 600
          rows = new = est = js = 0
          for p in glob.glob("work/rows/stats_*.json"):
              for tid, t in json.load(open(p))["tiles"].items():
                  rows += t["rows"]; js += t["json_bytes"]
                  gain = max(0, t["rows"] - (prev.get(tid) or 0))
                  new += gain; est += gain * per_row + (t["rows"] - gain) * per_existing
          db = int(os.environ.get("DB_BYTES") or 0)
          places = int(os.environ.get("PLACES_BYTES") or 0)
          places_cap = int(os.environ["PLACES_CAP_BYTES"]); db_cap = int(os.environ["DB_CAP_BYTES"])
          print(f"rows {rows} ({new} new), JSON {js} bytes, estimated {est} new database bytes; "
                f"places now {places or 'not read'} (cap {places_cap}); database now {db or 'not read'} (cap {db_cap})")
          blocked = None
          if places and places + est > places_cap:
              blocked = "size check: places would pass the 150 MB cap; not posting"
          elif db and db + est > db_cap:
              blocked = "size check: the database would pass 450 MB; not posting"
          if blocked:
              open("work/size_blocked", "w").write("1")  # the tiles wait as size_cap
              raise SystemExit(blocked)
          EOF

      - name: Post to the collector
        if: steps.budget.outputs.tiles != '' && steps.mode.outputs.post == 'true'
        env:
          PROJECT_REF: ${{ steps.mode.outputs.project_ref }}
          TILES: ${{ steps.budget.outputs.tiles }}
          RUN_ID: ${{ steps.mode.outputs.run_id }}
          ALLOW_DROP: ${{ steps.mode.outputs.allow_drop }}
        run: |
          extra=""
          [ "$ALLOW_DROP" = "true" ] && extra="--allow-drop"
          python3 -I scripts/places/extract_places.py post --base-url "https://$PROJECT_REF.supabase.co/functions/v1/collector" \
            --tiles "$TILES" --rows-dir work/rows --run-id "$RUN_ID" --previous work/previous.json $extra --out work/rows/post_results.json

      - name: Database size after
        if: always() && steps.budget.outputs.tiles != '' && steps.mode.outputs.post == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TILES: ${{ steps.budget.outputs.tiles }}
        run: |
          case "$TILES" in *[!0-9,]*) echo "bad tiles"; exit 1 ;; esac
          supabase db query --linked "select pg_database_size(current_database()) as db_bytes, pg_total_relation_size('public.places') as places_total_bytes, pg_relation_size('public.places') as places_heap_bytes, pg_indexes_size('public.places') as places_index_bytes, (select count(*) from public.places) as places_rows"
          supabase db query --linked "select t.id, t.status, t.row_count, t.osm_run_at is not null as osm_run, (select count(*) from public.places p where p.tile_id = t.id and p.source = 'osm' and p.status = 'active') as osm_active from public.place_tiles t where t.id = any (array[$TILES]::integer[]) order by t.id"
          supabase db query --linked "select kind, count(*) as n from public.places where source = 'osm' and tile_id = any (array[$TILES]::integer[]) group by kind order by n desc"

      # Why each queued tile is not built (budget, size_cap, extract_too_big), or null for the
      # tiles this run took, so the map can say why an area is still being mapped. Only wanted and
      # filling tiles change on the server; a tile this run finished is active and keeps none.
      - name: Record queue reasons
        if: always() && steps.mode.outputs.post == 'true' && steps.tiles.outputs.tiles != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TILES: ${{ steps.budget.outputs.tiles }}
        run: |
          python3 -I - <<'EOF'
          import collections, json, os
          d = json.load(open("work/deferred.json")) if os.path.exists("work/deferred.json") else {}
          blocked = os.path.exists("work/size_blocked")
          for t in [x for x in os.environ.get("TILES", "").split(",") if x]:
              d[t] = "size_cap" if blocked else None
          for k, v in d.items():
              assert k.isdigit() and v in (None, "budget", "size_cap", "extract_too_big")
          json.dump(d, open("work/reasons.json", "w"), separators=(",", ":"))
          print("queue reasons:", json.dumps({str(k): n for k, n in collections.Counter(d.values()).items()}))
          EOF
          reasons=$(cat work/reasons.json)
          [ "$reasons" = "{}" ] && { echo "no queued tiles"; exit 0; }
          supabase db query --linked "select public.place_tiles_set_queue_reasons('$reasons'::jsonb) as result"

      # The run's record for the collector health panel (migration 63, collector_job_runs): counts
      # only. A project or function without the route answers 404, which is ignored.
      - name: Record the run
        if: always() && env.COLLECTOR_SECRET != ''
        env:
          PROJECT_REF: ${{ steps.mode.outputs.project_ref }}
          RUN_ID: ${{ steps.mode.outputs.run_id }}
          OUTCOME: ${{ job.status == 'success' && 'ok' || 'failed' }}
        run: |
          body=$(python3 -I -c 'import json,sys;print(json.dumps({"job": sys.argv[1], "run_id": sys.argv[2], "outcome": sys.argv[3]}))' places_extract "$RUN_ID" "$OUTCOME")
          curl -sS -o /dev/null -w 'runs record: HTTP %{http_code}\n' -X POST -H "Content-Type: application/json" \
            -H "x-collector-secret: $COLLECTOR_SECRET" -d "$body" \
            "https://$PROJECT_REF.supabase.co/functions/v1/collector/runs/record" || true

      - name: Summary
        if: always() && steps.budget.outputs.tiles != ''
        run: |
          {
            echo "### Places extract (${{ steps.mode.outputs.target }}, post ${{ steps.mode.outputs.post }})"
            echo ""
            echo '```json'
            python3 -I -c 'import glob, json
          print(json.dumps([json.load(open(p)) for p in sorted(glob.glob("work/rows/stats_*.json"))], indent=1))' || true
            [ -f work/rows/post_results.json ] && cat work/rows/post_results.json
            [ -f work/deferred.json ] && cat work/deferred.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Counts only (stats and post results); the row files stay on the runner.
      - uses: actions/upload-artifact@v4
        if: always() && steps.budget.outputs.tiles != ''
        with:
          name: places-extract-stats
          path: |
            work/rows/stats_*.json
            work/rows/post_results.json
            work/plan.json
            work/sizes.json
            work/deferred.json
          if-no-files-found: ignore
          retention-days: 30
