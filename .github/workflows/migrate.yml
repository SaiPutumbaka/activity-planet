name: Migrate database then deploy

# Code must never reach production ahead of its migration (the July 2026 outage class).
# On push to main: apply supabase/migrations to staging, then to production, deploy the
# delete-account function to production, then trigger the Vercel deploy hooks. Turned on by
# setting the repository variable MIGRATIONS_ENABLED to "true" (kept unset until the production
# cutover in docs/ops/production-cutover.md).
#
# Staging only: Run workflow on any branch with staging_only ticked. It rehearses on a fresh
# database, applies that branch's migrations to staging, optionally runs staging_file there, and
# skips every production step (they also never run from a ref other than main). This is how Claude
# applies a new migration to staging before it merges, without the Supabase connector. With
# staging_functions it also deploys those Edge Functions to staging, and with staging_import_now
# it asks every enabled feed source to import once (D-037) and prints the run status.
#
# import-feed (D-037) is deployed to production after the push, like delete-account, and its URL
# is written into the project's vault entry. It needs no GitHub secret: pg_cron calls it with a
# shared secret generated inside each database by the importer migration. collector (D-041) is
# deployed the same way; its secret is generated inside each database by migration 28.
#
# The CLI is pinned (2.122.0, the TypeScript rewrite) so the cutover runs exactly the binary the
# dry run proved; bump it only after a fresh dry run. setup-cli v3 (a composite action on Node 24)
# installs that exact version from npm, falling back to the GitHub release asset.
#
# Secrets (all set 2026-10-27):
#   Launch audit H5: one Supabase access token per project, never one for both.
#   SUPABASE_STAGING_ACCESS_TOKEN repository secret: a token that can reach ONLY the staging
#                                project. Every staging step, on any branch, uses this one.
#   SUPABASE_PROD_ACCESS_TOKEN   secret of the `production` environment only (not a repository
#                                secret): a token that can reach ONLY production. Only jobs that
#                                run in that environment (main only, by its branch rule) see it.
#   SUPABASE_ACCESS_TOKEN        legacy token for both projects. Every step still falls back to it
#                                while the two above are missing, so H5 stays open until Sai
#                                creates them and deletes this repository secret (FOUNDER-TODO 3).
#                                The "check the token cannot reach production" step warns while
#                                the staging token can read production, and fails once the split
#                                token is set but still can.
#   Each token needs these scopes on its own project:
#                                Project Settings Read (link reads the project), API Keys Read and
#                                API Key Secrets Read (link reveals the keys), Connection Pooling
#                                Read (link saves the IPv4 pooler URL; GitHub runners have no IPv6
#                                and the direct db host is IPv6-only, so without it every database
#                                step fails with "IPv6 is not supported on your current network"),
#                                Database Read-write (db query runs the seed through the Management
#                                API), Edge Functions Read-write (the function deploy step; that
#                                step is continue-on-error, so a missing scope only logs a failure).
#                                Migrations go over Postgres through the pooler with the database
#                                password, so no Migrations scope is needed.
#   SUPABASE_STAGING_DB_PASSWORD database password of activity-planet-staging
#   SUPABASE_PROD_DB_PASSWORD    database password of the production project
#   VERCEL_DEPLOY_HOOK_WEB       deploy hook URL for the apps/web Vercel project
#   VERCEL_DEPLOY_HOOK_APP       deploy hook URL for the apps/app Vercel project
#
# "Run workflow" with dry_run ticked runs even while MIGRATIONS_ENABLED is unset. It rehearses the
# migrations and the seed on a throwaway local stack, links both projects, lists their migration
# history, probes the Management API query path, seeds staging (idempotent) and prints what db push
# would apply to each project without applying anything. Production is never written during a dry run.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/seed/**"
      - "supabase/functions/delete-account/**"
      - "supabase/functions/send-verification-code/**"
      - "supabase/functions/import-feed/**"
      - "supabase/functions/collector/**"
      - "supabase/functions/places-fill/**"
      - "supabase/functions/place-files/**"
      - "supabase/functions/image-guard/**"
      - "supabase/functions/send-notifications/**"
      - "supabase/functions/stripe-connect/**"
      - "supabase/functions/stripe-checkout/**"
      - "supabase/functions/stripe-webhook/**"
      - "supabase/functions/organizer-verify/**"
      - "supabase/functions/eventbrite-connect/**"
      - "supabase/functions/recs-embed/**"
      - "supabase/functions/weekly-scorecard/**"
      - "supabase/functions/_shared/**"
      - ".github/workflows/migrate.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse, link, list and show what would be pushed; apply nothing to production"
        type: boolean
        default: false
      staging_only:
        description: "Rehearse, then apply this ref's migrations (and staging_file) to staging only; production is never touched"
        type: boolean
        default: false
      staging_file:
        description: "Optional SQL file in this ref to run on staging after the push (for example a staging seed)"
        type: string
        default: ""
      staging_functions:
        description: "Staging only: space-separated Edge Functions in this ref to deploy to staging (for example import-feed)"
        type: string
        default: ""
      staging_fill_now:
        description: "Staging only: after the file, ask the places-fill function to run once (D-042 slice 9) and print its HTTP answer (counts only)"
        type: boolean
        default: false
      staging_match_now:
        description: "Staging only: after the file, ask the place-files function to match queued venues once (D-042 slice 11) and print its HTTP answer (counts only)"
        type: boolean
        default: false
      staging_classify_now:
        description: "Staging only: after the file, ask image-guard to classify a probe chat image (migration 71) and print its HTTP answer (counts only; without the Sightengine secrets it answers skipped no_key)"
        type: boolean
        default: false
      staging_import_now:
        description: "Staging only: after the file, ask every enabled feed source to import once and print the run status"
        type: boolean
        default: false
      staging_tests:
        description: "Staging only: run every test in supabase/tests/regression.txt in order; fail on the first failure"
        type: boolean
        default: false
      staging_tests_keep_going:
        description: "Staging only, with staging_tests: run every test even after a failure, then fail if any failed"
        type: boolean
        default: false

# Launch audit L16: one group per ref, so a second branch's staging run never silently replaces a
# pending main run (GitHub keeps one pending run per group).
concurrency:
  group: migrate-${{ github.ref }}
  cancel-in-progress: false

# Launch audit L6: read-only token.
permissions:
  contents: read

env:
  STAGING_PROJECT_REF: gzrscndzzggxmcwnvvcq
  PROD_PROJECT_REF: gtesfiqxqontescqpllo
  SUPABASE_CLI_VERSION: 2.122.0
  DRY_RUN: ${{ inputs.dry_run == true && '--dry-run' || '' }}

jobs:
  # Applies all migration files and the seed to a fresh local database through the CLI's own
  # statement splitter and transaction batching, so a file that the CLI handles differently from
  # the management API fails here, on the runner, not on production.
  rehearse:
    if: inputs.dry_run == true || inputs.staging_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.122.0

      - name: Start a throwaway local stack (Postgres, Auth, Storage only)
        run: |
          supabase start -x realtime,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor --ignore-health-check

      - name: Apply every migration and the seed through the CLI
        run: |
          supabase db reset --local --yes

      - name: Show the local migration history
        run: |
          supabase migration list --local

  migrate:
    # Waits for the rehearsal when it runs (dry runs and staging-only runs) and never pushes after
    # a failed one; on a push to main the rehearsal is skipped and this runs straight away.
    needs: rehearse
    if: ${{ !cancelled() && needs.rehearse.result != 'failure' && (vars.MIGRATIONS_ENABLED == 'true' || inputs.dry_run == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.122.0

      - name: Staging, check the token cannot reach production (launch audit H5)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          SPLIT: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN != '' && 'yes' || '' }}
        run: |
          # HTTP status only; the response body is discarded.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROD_PROJECT_REF" || true)
          if [ "$code" = "200" ]; then
            if [ -n "$SPLIT" ]; then
              echo "::error::SUPABASE_STAGING_ACCESS_TOKEN can read the production project. Replace it with a staging-only token."
              exit 1
            fi
            echo "::warning::Launch audit H5 is open: the token staging steps use can read production. Create SUPABASE_STAGING_ACCESS_TOKEN (staging only) and SUPABASE_PROD_ACCESS_TOKEN (production environment only), then delete the repository secret SUPABASE_ACCESS_TOKEN."
          else
            echo "The staging token cannot read production (HTTP $code)."
          fi

      - name: Staging, link and list migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$STAGING_PROJECT_REF"
          supabase migration list --linked

      - name: Staging, probe the Management API query path
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
        run: |
          supabase db query --linked "select 1 as ok"

      - name: Staging, push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
        run: |
          # --include-all: files older than the newest applied version are still pushed (a
          # migration merged out of order is intentional here, never a mistake to hide).
          supabase db push --linked --include-all --yes $DRY_RUN
          # Migration 22: the only image URLs accepted are this project's Storage URLs; the
          # base is derived from the ref, never typed. Stale URLs outside it are cleared.
          if [ -z "$DRY_RUN" ]; then
            supabase db query --linked "select public.set_project_url('https://$STAGING_PROJECT_REF.supabase.co')"
          fi

      # Runs on dry runs too: the seeds are idempotent, staging is the test project, and this is
      # the only step that exercises large bodies (hubs 66 KB, place rules) on the Management API
      # query endpoint. place_rules.sql (D-041, generated) needs the hubs, so it runs second.
      - name: Staging, seed hubs and place rules
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
        run: |
          supabase db query --linked --file supabase/seed/hubs.sql
          supabase db query --linked --file supabase/seed/place_rules.sql

      # Staging only: deploy the named functions from this ref. import-feed also gets this
      # project's function URL written into its vault entry (public.import_set_function_url);
      # the URL is derived from the project ref, the shared secret never leaves the database.
      - name: Staging, deploy the requested functions
        if: inputs.staging_only == true && inputs.staging_functions != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
          FUNCTIONS: ${{ inputs.staging_functions }}
        run: |
          for fn in $FUNCTIONS; do
            case "$fn" in
              *[!a-z0-9-]*) echo "Refusing function name: $fn"; exit 1 ;;
            esac
            test -f "supabase/functions/$fn/index.ts" || { echo "No such function: $fn"; exit 1; }
            case "$fn" in import-feed|collector|places-fill|place-files|image-guard|send-notifications|stripe-checkout|stripe-webhook|eventbrite-connect|recs-embed|weekly-scorecard|delete-account) flags="--no-verify-jwt" ;; *) flags="" ;; esac
            supabase functions deploy "$fn" --project-ref "$STAGING_PROJECT_REF" --use-api $flags
            if [ "$fn" = "import-feed" ]; then
              supabase db query --linked \
                "select public.import_set_function_url('https://$STAGING_PROJECT_REF.supabase.co/functions/v1/import-feed')"
            fi
          done

      # Lets Claude apply a branch's migration and staging-only data to staging without the
      # Supabase connector, whose destructive-SQL confirmation cannot reach cloud sessions.
      - name: Staging, run the requested file
        if: inputs.staging_file != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
          STAGING_FILE: ${{ inputs.staging_file }}
        run: |
          supabase db query --linked --file "$STAGING_FILE"

      # Staging only: the regression suite. Each file in supabase/tests/regression.txt is one
      # transaction that rolls back and prints pass/fail only (the logs are public). The manifest
      # must name every *.sql in supabase/tests, as a test or on a skip: line, so a new file is
      # never left out silently. Stops at the first failure unless staging_tests_keep_going.
      - name: Staging, run the regression suite
        if: inputs.staging_only == true && inputs.staging_tests == true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
          KEEP_GOING: ${{ inputs.staging_tests_keep_going == true && '1' || '' }}
        run: |
          manifest=supabase/tests/regression.txt
          listed=$(sed -e 's/#.*//' -e 's/^skip:[[:space:]]*//' -e 's/[[:space:]]*$//' "$manifest" | grep -v '^$' | sort)
          present=$(cd supabase/tests && ls *.sql | sort)
          if [ "$listed" != "$present" ]; then
            echo "regression.txt does not match supabase/tests/*.sql:"
            diff <(echo "$listed") <(echo "$present") || true
            exit 1
          fi
          tests=$(sed -e 's/#.*//' -e 's/[[:space:]]*$//' "$manifest" | grep -v '^$' | grep -v '^skip:')
          total=$(echo "$tests" | wc -l); n=0; failed=""
          for t in $tests; do
            n=$((n + 1))
            echo "::group::[$n/$total] $t"
            if supabase db query --linked --file "supabase/tests/$t"; then
              echo "::endgroup::"; echo "PASS $t"
            else
              echo "::endgroup::"; echo "FAIL $t"
              failed="$failed $t"
              [ -n "$KEEP_GOING" ] || { echo "Stopped at the first failure ($n of $total)."; exit 1; }
            fi
          done
          if [ -n "$failed" ]; then echo "Failed:$failed"; exit 1; fi
          echo "All $total regression tests passed."

      # Staging only: one import run per enabled source through the same path pg_cron uses
      # (pg_net to the function), then the run status. Prints counts and errors, never secrets.
      - name: Staging, import once
        if: inputs.staging_only == true && inputs.staging_import_now == true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
        run: |
          supabase db query --linked "select public.import_dispatch_all() as requests"
          sleep 100
          supabase db query --linked "select slug, enabled, last_run_at, last_ok_at, item_count, last_stats, left(last_error, 300) as last_error from public.feed_sources order by slug"

      # Staging only: one places-fill run through the same path pg_cron uses (pg_net with the
      # collector secret, forced even when no tile is fillable), then the function's HTTP answer.
      # Without GEOAPIFY_SERVER_KEY on the project the answer is {"skipped":"no_key"}. The answer
      # holds counts and error names only; the request headers (the secret) are never printed.
      - name: Staging, places fill once
        if: inputs.staging_only == true && inputs.staging_fill_now == true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
        run: |
          supabase db query --linked "select public.places_fill_dispatch('check', true) as request"
          sleep 45
          supabase db query --linked "select r.id, r.status_code, r.timed_out, left(r.error_msg, 200) as error, left(r.content, 1500) as content from net._http_response r where r.created > now() - interval '5 minutes' and (r.content like '{\"skipped\"%' or r.content like '{\"tiles\"%' or r.content like '{\"error\"%' or r.timed_out or r.error_msg is not null) order by r.created desc limit 3"

      # Staging only: one place-files match run through the same path pg_cron uses (pg_net with the
      # collector secret, forced even when no venue is queued), then the function's HTTP answer.
      # Before any place file is published the answer is a run with nothing queued. The answer holds
      # counts only; the request headers (the secret) are never printed.
      - name: Staging, place match once
        if: inputs.staging_only == true && inputs.staging_match_now == true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
        run: |
          supabase db query --linked "select public.place_match_dispatch(true) as request"
          sleep 30
          supabase db query --linked "select r.id, r.status_code, r.timed_out, left(r.error_msg, 200) as error, left(r.content, 1500) as content from net._http_response r where r.created > now() - interval '5 minutes' and (r.content like '{\"venues\"%' or r.content like '{\"skipped\"%' or r.content like '{\"error\"%' or r.timed_out or r.error_msg is not null) order by r.created desc limit 3"

      # Staging only: one image-guard classify request through the same path the database uses
      # (pg_net with the image-guard secret) for a probe path no message uses, then the function's
      # HTTP answer. Without SIGHTENGINE_API_USER and SIGHTENGINE_API_SECRET on the project the
      # answer is {"skipped":"no_key",...,"messages":0}; with them it is {"skipped":"not_pending"}
      # (nothing waits at the probe path, so no Sightengine operation is spent). The answer holds
      # counts only; the request headers (the secret) are never printed.
      - name: Staging, image classify probe once
        if: inputs.staging_only == true && inputs.staging_classify_now == true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
        run: |
          probe="00000000-0000-4000-8000-000000000000/00000000-0000-4000-8000-000000000000/00000000-0000-4000-8000-000000000071.jpg"
          supabase db query --linked "select public.image_guard_dispatch(jsonb_build_object('op', 'classify', 'bucket', 'chat-images', 'path', '$probe')) as request"
          sleep 30
          supabase db query --linked "select r.id, r.status_code, r.timed_out, left(r.error_msg, 200) as error, left(r.content, 500) as content from net._http_response r where r.created > now() - interval '5 minutes' and (r.content like '{\"skipped\"%' or r.content like '{\"verdict\"%' or r.content like '{\"error\"%' or r.timed_out or r.error_msg is not null) order by r.created desc limit 3"

      # Schema only (the same content as the committed types file), never row data: the repo and
      # its Action logs are public. Lets Claude regenerate packages/core/src/types/database.ts
      # without the Supabase connector.
      - name: Staging, print generated Database types
        if: inputs.staging_only == true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "----- BEGIN database.ts -----"
          supabase gen types --linked --lang typescript --schema public
          echo "----- END database.ts -----"

  # Launch audit H5: production steps run in their own job under the GitHub Environment
  # "production" (Settings, Environments: limited to main, required reviewers, and the
  # SUPABASE_PROD_DB_PASSWORD and VERCEL_DEPLOY_HOOK_* secrets moved there), so a workflow on any
  # other branch never receives them. Until the environment is configured, GitHub creates it
  # unprotected on first use and the repository secrets still apply.
  production:
    needs: migrate
    if: ${{ !cancelled() && needs.migrate.result == 'success' && inputs.staging_only != true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.122.0
      - name: Production, link and list migrations
        if: inputs.staging_only != true && github.ref == 'refs/heads/main'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PROD_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$PROD_PROJECT_REF"
          supabase migration list --linked

      - name: Production, probe the Management API query path
        if: inputs.staging_only != true && github.ref == 'refs/heads/main'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PROD_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
        run: |
          supabase db query --linked "select 1 as ok"

      - name: Production, push migrations
        if: inputs.staging_only != true && github.ref == 'refs/heads/main'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PROD_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
        run: |
          supabase db push --linked --include-all --yes $DRY_RUN
          if [ -z "$DRY_RUN" ]; then
            supabase db query --linked "select public.set_project_url('https://$PROD_PROJECT_REF.supabase.co')"
          fi

      - name: Production, seed hubs and place rules
        if: inputs.dry_run != true && inputs.staging_only != true && github.ref == 'refs/heads/main'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PROD_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
        run: |
          supabase db query --linked --file supabase/seed/hubs.sql
          supabase db query --linked --file supabase/seed/place_rules.sql

      # delete-account calls request_account_deletion(), which the migrations create, so it is
      # deployed after the push. Migration 77: without the gateway JWT check, so pg_cron can call
      # its sweep with the database's own secret; the function verifies member JWTs itself.
      - name: Production, deploy the delete-account function
        id: deploy_delete_account
        if: inputs.dry_run != true && inputs.staging_only != true && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PROD_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy delete-account --project-ref "$PROD_PROJECT_REF" --use-api --no-verify-jwt

      # send-verification-code (campus email codes, PLAN.md 4.1) was held back until its
      # RESEND_API_KEY secret existed (without it the code is logged as skipped, never emailed).
      # Sai set RESEND_API_KEY on both projects on Nov 8, so it now ships with every main push. It
      # keeps the gateway JWT check and also verifies the caller's JWT itself (config.toml).
      - name: Production, deploy the send-verification-code function
        id: deploy_send_verification_code
        if: inputs.dry_run != true && inputs.staging_only != true && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PROD_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy send-verification-code --project-ref "$PROD_PROJECT_REF" --use-api

      # import-feed is called by pg_cron, so it is deployed after the push that creates its
      # RPCs; its URL goes into this project's vault entry. Production feed sources stay
      # disabled (D-037), so no job is scheduled until a data change enables one.
      - name: Production, deploy the import-feed function
        id: deploy_import_feed
        if: inputs.dry_run != true && inputs.staging_only != true && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PROD_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
        run: |
          supabase functions deploy import-feed --project-ref "$PROD_PROJECT_REF" --use-api --no-verify-jwt
          supabase db query --linked \
            "select public.import_set_function_url('https://$PROD_PROJECT_REF.supabase.co/functions/v1/import-feed')"

      # collector (D-041 slice 4) is the hub map jobs' ingest path; it calls RPCs the push creates,
      # so it is deployed after it. Its shared secret is generated inside the database.
      - name: Production, deploy the collector function
        id: deploy_collector
        if: inputs.dry_run != true && inputs.staging_only != true && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PROD_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy collector --project-ref "$PROD_PROJECT_REF" --use-api --no-verify-jwt

      # places-fill (D-042 slice 9) is called by pg_cron through pg_net; it calls RPCs the push
      # creates, so it is deployed after it. It needs no GitHub secret: GEOAPIFY_SERVER_KEY is an
      # optional Supabase Edge Function secret, and without it every run answers skipped: no key.
      - name: Production, deploy the places-fill function
        id: deploy_places_fill
        if: inputs.dry_run != true && inputs.staging_only != true && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PROD_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy places-fill --project-ref "$PROD_PROJECT_REF" --use-api --no-verify-jwt

      # place-files (D-042 slice 11) is called by pg_cron through pg_net (venue matching) and by
      # signed-in members (a file place's row); it calls RPCs the push creates, so it is deployed
      # after it. No secret of its own: it reads the published files from meta.places_base_url.
      - name: Production, deploy the place-files function
        id: deploy_place_files
        if: inputs.dry_run != true && inputs.staging_only != true && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PROD_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy place-files --project-ref "$PROD_PROJECT_REF" --use-api --no-verify-jwt

      # image-guard (migration 52) hashes profile photos and covers for the NCII flow; the database
      # calls it through pg_net with a secret generated inside the database, and it calls RPCs the
      # push creates, so it is deployed after it. No secret of its own.
      - name: Production, deploy the image-guard function
        id: deploy_image_guard
        if: inputs.dry_run != true && inputs.staging_only != true && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PROD_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy image-guard --project-ref "$PROD_PROJECT_REF" --use-api --no-verify-jwt

      # send-notifications (migration 55) is the email and push delivery worker; pg_cron calls it
      # through pg_net with a secret generated inside the database, and it calls RPCs the push
      # creates, so it is deployed after it. RESEND_API_KEY and VAPID_PUBLIC_KEY /
      # VAPID_PRIVATE_KEY / VAPID_SUBJECT are optional Edge Function secrets set by hand on each
      # project; without them every email and push is marked skipped, never sent.
      - name: Production, deploy the send-notifications function
        id: deploy_send_notifications
        if: inputs.dry_run != true && inputs.staging_only != true && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PROD_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy send-notifications --project-ref "$PROD_PROJECT_REF" --use-api --no-verify-jwt

      # Coaching payments (migration 60, D-044). The three functions call RPCs the push creates, so
      # they are deployed after it. Each is key-gated: without STRIPE_SECRET_KEY (and, for the
      # webhook, STRIPE_WEBHOOK_SECRET), optional Edge Function secrets set by hand on each project,
      # every request answers 503 payments_off and the product runs in requests-only mode.
      # stripe-connect keeps the gateway JWT check; stripe-checkout (called by the database with
      # its own secret, and by users with a JWT it verifies) and stripe-webhook (signed by Stripe)
      # do not.
      - name: Production, deploy the stripe-connect function
        id: deploy_stripe_connect
        if: inputs.dry_run != true && inputs.staging_only != true && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PROD_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy stripe-connect --project-ref "$PROD_PROJECT_REF" --use-api

      - name: Production, deploy the stripe-checkout function
        id: deploy_stripe_checkout
        if: inputs.dry_run != true && inputs.staging_only != true && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PROD_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy stripe-checkout --project-ref "$PROD_PROJECT_REF" --use-api --no-verify-jwt

      - name: Production, deploy the stripe-webhook function
        id: deploy_stripe_webhook
        if: inputs.dry_run != true && inputs.staging_only != true && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PROD_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy stripe-webhook --project-ref "$PROD_PROJECT_REF" --use-api --no-verify-jwt

      # Collector completion (migrations 62 and 63). organizer-verify (the DNS TXT proof of an
      # organizer claim) keeps the gateway JWT check; eventbrite-connect is key-gated (without
      # EVENTBRITE_CLIENT_ID, EVENTBRITE_CLIENT_SECRET and EVENTBRITE_REDIRECT_URI every request
      # answers {"skipped":"no key"}) and its sync caller is the collector job, so the gateway check
      # is off. Both call RPCs the push creates, so they are deployed after it.
      - name: Production, deploy the organizer-verify function
        id: deploy_organizer_verify
        if: inputs.dry_run != true && inputs.staging_only != true && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PROD_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy organizer-verify --project-ref "$PROD_PROJECT_REF" --use-api

      - name: Production, deploy the eventbrite-connect function
        id: deploy_eventbrite_connect
        if: inputs.dry_run != true && inputs.staging_only != true && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PROD_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy eventbrite-connect --project-ref "$PROD_PROJECT_REF" --use-api --no-verify-jwt

      # Recommendations (migration 67, D-045). recs-embed is called by pg_cron through pg_net with a
      # secret generated inside the database and runs Supabase's built-in gte-small model (no key);
      # weekly-scorecard is key-gated (without RESEND_API_KEY and SCORECARD_TO every run is recorded
      # as skipped_no_key). Both call RPCs the push creates, so they are deployed after it.
      - name: Production, deploy the recs-embed function
        id: deploy_recs_embed
        if: inputs.dry_run != true && inputs.staging_only != true && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PROD_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy recs-embed --project-ref "$PROD_PROJECT_REF" --use-api --no-verify-jwt

      - name: Production, deploy the weekly-scorecard function
        id: deploy_weekly_scorecard
        if: inputs.dry_run != true && inputs.staging_only != true && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PROD_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy weekly-scorecard --project-ref "$PROD_PROJECT_REF" --use-api --no-verify-jwt

      - name: Deploy web and app
        if: inputs.dry_run != true && inputs.staging_only != true && github.ref == 'refs/heads/main'
        env:
          HOOK_WEB: ${{ secrets.VERCEL_DEPLOY_HOOK_WEB }}
          HOOK_APP: ${{ secrets.VERCEL_DEPLOY_HOOK_APP }}
        run: |
          # Secrets cannot be tested in an `if:` expression, so the check lives in the shell.
          if [ -z "$HOOK_WEB" ]; then echo "No deploy hooks configured; skipping."; exit 0; fi
          curl -fsS -X POST "$HOOK_WEB" >/dev/null
          if [ -n "$HOOK_APP" ]; then curl -fsS -X POST "$HOOK_APP" >/dev/null; fi

      # Launch audit M6: the deploy steps above are continue-on-error so one failure does not stop
      # the rest; this step turns any of them red at the end, so a failed deploy is never a green run.
      - name: Fail if any function deploy failed
        if: ${{ !cancelled() && inputs.dry_run != true && inputs.staging_only != true && github.ref == 'refs/heads/main' }}
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          failed=$(echo "$STEPS" | jq -r 'to_entries[] | select(.key | startswith("deploy_")) | select(.value.outcome == "failure") | .key')
          if [ -n "$failed" ]; then
            echo "::error::Function deploys failed:"; echo "$failed"
            exit 1
          fi
          echo "Every function deploy succeeded."
