name: Collector dry run

# Runs the D-040 event collector against a seeded city with --dry-run: it fetches the real
# sources (robots.txt, feeds, schema.org Event pages) and prints per-source counts and reasons
# only, plus one --diagnose line of request metadata and parser counts per request. Nothing is written to a database, and no item text reaches the log beyond the counts the
# CLI prints, because this repository and its Action logs are public.

on:
  workflow_dispatch:
    inputs:
      region:
        description: "City seed file under packages/collector/data/cities (for example atl)"
        type: string
        default: atl
      dataset:
        description: "Instead of a city: one open-data dataset id under packages/collector/data/opendata, alone, on or off (a live check)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Collect (dry run)
        env:
          REGION: ${{ inputs.region }}
          DATASET: ${{ inputs.dataset }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: |
          if [ -n "$SOCRATA_APP_TOKEN" ]; then echo "::add-mask::$SOCRATA_APP_TOKEN"; fi
          if [ -n "$DATASET" ]; then
            case "$DATASET" in *[!a-z0-9-]*) echo "Refusing dataset: $DATASET"; exit 1 ;; esac
            pnpm --filter collector collect --dataset "$DATASET" --dry-run --diagnose
            exit 0
          fi
          case "$REGION" in
            *[!a-z0-9-]*|"") echo "Refusing region: $REGION"; exit 1 ;;
          esac
          # --diagnose prints one line per request (status, final host, media type, size,
          # robots.txt and parser verdicts): metadata and counts only, never item or page text.
          pnpm --filter collector collect --region "$REGION" --dry-run --diagnose
